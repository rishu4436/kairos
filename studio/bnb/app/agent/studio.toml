# Operating runtime only. This file does not describe the user's Agentic Wallet.
# KAIROS execution mode is PAPER in studio/entrypoint.ts. A request string cannot select LIVE.
# The [wallet] block is the throwaway BSC-testnet OPERATING wallet.
# It must not be used as trading capital.

[project]
name = "kairos-agent"

[stack]
runtime = "agentcore"
protocols = ["A2A"]

[network]
default = "bsc-testnet"

[wallet]
kind = "evm-local"
signer = "local"
keystore_dir = "../../.studio/wallets"
address = "0xe7a6b15AE66ddCe94C28BC47c66e60222824494E"

[llm]
provider = "none"
model = ""

[payments]
allowed_payment_tokens = ["U","USDC","USDT"]

[payments.seller]
price_usd = "0"
assets = ["TEST_U","TEST_USDC","TEST_USDT"]

[payments.erc8183]
# Free KAIROS Market Intelligence Brief; pricing is canonical [payments.seller].
enabled = true
quote_ttl_seconds = 900
default_estimated_completion_seconds = 600
poll_interval_seconds = 30
auto_settle = false

[storage]
# Studio deliverables only. This is not KAIROS runtime state.
# Upload uses STORAGE_API_URL and STORAGE_API_KEY from the uncommitted
# workspace .studio/.env.local. Neither value is stored in this file.
kind = "ipfs"

[payments.b402_seller]
enabled = false
pay_to = ""
work_timeout_seconds = 60

[budget]
enabled = false
acknowledged_at = "2026-10-07T00:00:00Z"
max_per_topup_usd = 1.0
max_per_day_usd = 3.0
max_per_month_usd = 15.0
